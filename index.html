
<!DOCTYPE html>
<html>
<head>
    <title>JARVIS</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./iron-pic.png">
</head>

<body>

    <div class="machine">

        <div class="clock cont">
            <img src="./clock1.png" class="icon">
            <p id="time"></p>
        </div>

        <div class="internet cont">
            <img src="./internet1.png" class="icon">
            <p id="internet"></p>
        </div>

        <div class="battery cont">
            <img src="./battery1.png" class="icon">
            <p id="battery"></p>
        </div>

        <div class="temp">
            <p id="location"></p>
            <p id="country"></p>
            <p id="weatherT"></p>
            <p id="weatherD"></p>
            <img src="" id="weatherIcon">
            <p id="oTemp"></p>
            <p id="feelLikeTemp"></p>
            <p id="minT"></p>
            <p id="maxT"></p>
        </div>

    <a href="./Download.html"><img src="./heart.gif" id="heart"></a>
<div class="download">
    <p><font size="4.5" ><b>For Desktop</font></b></p>
</div>

    <button id="start_jarvis_btn">
        <img src="./heart.gif">
        <p>Start Recognition</p>
    </button>

    <button id="stop_jarvis_btn">
        <img src="./heart.gif">
        <p>Stop Recognition</p>
    </button>

    <div class="small_jarvis">
        <button id="small_jarvis">
            <img src="./iron_man.gif">
            <p>Make Me Small</p>
        </button>
    </div>

    <div class="jarvis_setup">

        <label>Your Name</label>
        <input type="text">

        <label>Your Bio</label>
        <input type="text">

        <label>Your Location</label>
        <input type="text">

        <label>Instagram Profile</label>
        <input type="text">

        <label>Twitter Profile</label>
        <input type="text">

        <label>GitHub Profile</label>
        <input type="text">

        <button id="sub_btn">Submit</button>

    </div>

    <script src="./app.js"></script>

</body>
</html>
